[package]
name = "danmaku-bot-with-ui"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
brotli = "9.1.1"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3.34", features = ["tokio-io"] }
gpui-kit = "0.8.1"
md-5 = "0.11.0"
reqwest = { version = "0.13.5", features = ["cookies", "json", "gzip"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
