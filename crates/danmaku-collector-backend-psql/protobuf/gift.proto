syntax = "proto3";
package dm_proto.gift;

message MedalInfo {
    string name = 1;
    int64 level = 2;
    int64 owner = 10;
}

message GiftInfo {
    string name = 2;
    int32 count = 3;
    int32 price = 5;
    int32 paid_price = 6;
    string type = 8;
}

message Medal {
    MedalInfo medal_info = 3;
}

message Gift {
    int64 uid = 1;
    string nickname = 2;
    GiftInfo info = 10;
    Medal medal = 15;
}
