syntax = "proto3";
package dm_proto.gift;

import "user_info.proto";

message GiftInfo {
    string name = 2;
    int32 count = 3;
    int32 price = 5;
    int32 paid_price = 6;
    string type = 8;
}
message Gift {
    int64 uid = 1;
    string nickname = 2;
    GiftInfo info = 10;
    dm_proto.user_info.UserInfo user = 15;
}
