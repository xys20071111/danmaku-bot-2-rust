[package]
name = "danmaku-collector-backend-psql"
version = "0.1.0"
edition = "2024"

[dependencies]
prost = "0.14"
anyhow = "1.0.104"
postgres = { version = "0.19.14", features = ["with-serde_json-1"] }
serde = { version = "1.0.229", features = ["derive"] }
